name = "profile-inbox"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Your site's origin: scheme + host only, NO path and NO trailing slash.
# GitHub Pages example: "https://yourname.github.io"
# Several origins are allowed, separated by commas.
ALLOWED_ORIGIN = "https://YOURNAME.github.io"

[[d1_databases]]
binding = "DB"
database_name = "profile-inbox"
database_id = "PASTE-THE-ID-FROM-STEP-2"
